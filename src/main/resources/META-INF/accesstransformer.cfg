# Access Transformer - RottenRuins: The Hall
# NOTE: Forge AT parser rejects a bare "#" line. Every comment line needs text after "#".
# Entries would be named by SRG name (the AT is applied to the SRG-named jar), with the
# Mojang name as a trailing comment, e.g.:
#     public net.minecraft.world.entity.Entity f_19820_ # uuid
# THIS FILE CURRENTLY HAS NO ENTRIES, ON PURPOSE.
# It replaces a machine-generated 13,957-line "widen everything" version that listed
# 4,652 vanilla/Forge classes as three lines each:
#     public-f <class>
#     public-f <class> *
#     public-f <class> *()
# The "*()" line made every METHOD of every class public. Java forbids overriding a
# public method with a weaker access modifier, so the mod's own overrides failed to
# compile with 68 errors of the form:
#     "defineSynchedData() cannot override defineSynchedData(); attempting to assign
#      weaker access privileges; was public"
# Affected overrides included Entity.defineSynchedData / readAdditionalSaveData /
# addAdditionalSaveData, Mob.registerGoals / createNavigation, LivingEntity.checkFallDamage,
# Block.createBlockStateDefinition, Projectile.onHitEntity, TagsProvider.addTags,
# RecipeProvider.buildRecipes, EntityLootSubProvider.getKnownEntityTypes and
# BlockLootSubProvider.generate / getKnownBlocks.
# After removing the "*()" lines only ONE widened member was still needed:
#     public net.minecraft.world.entity.Entity f_19820_ # uuid
# That was for magic/bases/MagicHandle.java, which read the protected field
# `player.uuid`. MagicHandle now calls Entity#getUUID() (the correct public API), so that
# entry was dropped as well and the mod needs no access transformer at all.
# Keep this file - build.gradle points at it. If you ever genuinely need to reach a
# protected/private vanilla member, add ONE line using its SRG name. Do not regenerate
# the wildcard version.
