buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'maven-publish'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// ── JPMS fix ────────────────────────────────────────────────────────
// Problem: cloth-config and geckolib each embed Architectury inject
//   packages with module-info.class. Under JPMS two modules exporting
//   the same package → ResolutionException.
//
// Fix: strip module-info.class from conflicting jars → automatic modules.
//   FG6 puts the dev mod on the classpath (not module path), so no
//   duplicate-package issue exists for build output directories.

configurations {
    // Resolves conflicting jars for patching. Not on runtime classpath.
    patchModuleInfo
}

minecraft {
    jarJar.enable()
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            jvmArg '--add-opens=java.base/sun.misc=ALL-UNNAMED'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// MixinGradle 0.7-SNAPSHOT does not copy the refmap from tmp to the
// resources output directory. Do it manually so the runtime can find it.
tasks.register('copyRefmap', Copy) {
    dependsOn 'compileJava'
    from layout.buildDirectory.dir("tmp/compileJava")
    into layout.buildDirectory.dir("resources/main")
    include "${mod_id}.refmap.json"
}
tasks.named('processResources').configure { dependsOn 'copyRefmap' }

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir { dir 'libs' }

    maven { url = 'https://maven.shedaniel.me/' }

    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }

    maven { url = "https://modmaven.dev/" }

    // 本地 maven — infcore 前置
    mavenLocal()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // cloth-config + geckolib: compileOnly (compile-time) +
    // patchModuleInfo (for stripping module-info). The patched jars
    // are added to --module-path at launch so FML discovers them.
    compileOnly fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.7.1")
    patchModuleInfo fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.7.1")

    compileOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:12.0.109")
    patchModuleInfo fg.deobf("me.shedaniel.cloth:cloth-config-forge:12.0.109")

    jarJar(group: 'me.shedaniel.cloth', name: 'cloth-config-forge', version: '[12.0.109,13)')
    jarJar(group: 'software.bernie.geckolib', name: 'geckolib-forge-1.20.1', version: '[4.7.1,4.8)')

    // JEI (optional)
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.2.0.27")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.2.0.27")

    // InfectionCoreFramework 前置 — 提供进化系统、击杀计数、方块扩散和全局难度框架
    implementation fg.deobf("org.bytechen:infcore:0.1.1")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// ── Strip module-info from conflicting jars ─────────────────────────

def patchedModsDir = layout.buildDirectory.dir("patched-mods")

tasks.register('patchModJars') {
    group = 'forgegradle runs'
    description = 'Strip module-info.class from cloth-config + geckolib to avoid JPMS collisions'

    inputs.files(configurations.patchModuleInfo)
    outputs.dir(patchedModsDir)

    doLast {
        def dest = patchedModsDir.get().asFile
        dest.deleteDir()
        dest.mkdirs()

        configurations.patchModuleInfo.each { jar ->
            // Use original name (not _mapped) so FML recognises it
            def cleanName = jar.name
                .replace('_mapped_official_1.20.1', '')
                .replace('.jar', '-patched.jar')
            def patched = new File(dest, cleanName)
            ant.zip(destfile: patched.absolutePath) {
                zipfileset(src: jar.absolutePath) {
                    exclude(name: 'module-info.class')
                    exclude(name: 'META-INF/versions/*/module-info.class')
                }
            }
            logger.lifecycle("  Patched: ${jar.name} → ${cleanName}")
        }
    }
}

// Copy patched jars into run/mods so FML discovers them as mods.
// FG6 userdev puts external mods on the module path IF they're
// found in run/mods at launch time. The patched jars have
// module-info.class stripped → automatic modules → no JPMS collision.
tasks.register('copyPatchedMods', Copy) {
    group = 'forgegradle runs'
    description = 'Copy patched (module-info stripped) jars to run/mods for FML discovery'
    from patchedModsDir
    into layout.projectDirectory.dir('run/mods')
    dependsOn 'patchModJars'
}

// runData uses run-data/ as its working directory — copy there too.
tasks.register('copyPatchedModsForData', Copy) {
    group = 'forgegradle runs'
    description = 'Copy patched mod jars to run-data/mods for runData discovery'
    from patchedModsDir
    into layout.projectDirectory.dir('run-data/mods')
    dependsOn 'patchModJars'
}

// Ensure patched jars land in both run directories before launch.
tasks.named('assemble').configure { dependsOn 'copyPatchedMods', 'copyPatchedModsForData' }

// ── Resource processing ────────────────────────────────────────────

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task devJar(type: Jar) {
    archiveClassifier = 'dev'
    from sourceSets.main.output
    manifest.from(jar.manifest)
    dependsOn classes
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

artifacts {
    archives sourcesJar
    archives devJar
}

build.dependsOn devJar

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
            artifact devJar
            artifact sourcesJar
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
